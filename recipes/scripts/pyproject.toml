# recipes/scripts/pyproject.toml

[project]
name = "scripts"
version = "0.1.0"
description = "CLIs for release FLAC fetch, Typst covers, MP4 encode, and MP4 release metadata"
license = "Apache-2.0"
authors = [{ name = "Sierra Arn", email = "unweariedheart@gmail.com" }]
dependencies = []

[project.scripts]
fetch-release-flacs = "scripts.fetch_release_flacs:main"
typst-compile = "scripts.typst_compile:main"
encode-mp4 = "scripts.encode_mp4:main"
write-mp4-metadata = "scripts.write_mp4_metadata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]
